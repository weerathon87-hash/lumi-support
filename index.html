

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171326">
  <title>Lumi Support ♡</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px 16px;
      min-height: 100vh;
      color: #f7f3ff;
      font-family: system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #49346b, transparent 60%), #12101c;
    }

    main { max-width: 580px; margin: auto; }
    header { text-align: center; margin: 20px 0 28px; }
    header .logo { font-size: 44px; color: #d7b8ff; }
    h1 { margin: 8px 0; }
    .muted { color: #bcb3cf; line-height: 1.7; }

    .panel {
      padding: 24px;
      border: 1px solid #504064;
      border-radius: 20px;
      background: #1e192c;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #514361;
      border-radius: 10px;
      color: white;
      background: #171322;
      font: inherit;
    }

    textarea { min-height: 130px; resize: vertical; }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #cbb0fa;
      color: #21162d;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #status {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    #status.show { display: block; }
    #status.success { background: #173c30; color: #b7f6d8; }
    #status.error { background: #49252e; color: #ffd0d8; }
    footer { text-align: center; color: #a89bb9; margin: 20px 0; }

    @media (max-width: 480px) {
      .panel { padding: 18px; }
    }
  </style>
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div class="logo">✦</div>
      <h1>Lumi Support</h1>
      <p class="muted">ศูนย์ช่วยเหลือและแจ้งปัญหา<br>เราพร้อมรับฟังทุกเรื่อง ♡</p>
    </header>

    <section class="panel">
      <h2>ส่งรายงานปัญหา</h2>
      <p class="muted">กรอกรายละเอียดเพื่อแจ้งทีมงาน</p>

      <form id="reportForm">
        <label for="username">ชื่อผู้แจ้ง</label>
        <input id="username" name="username"
          minlength="2" maxlength="100" required
          placeholder="ชื่อของคุณ">

        <label for="category">ประเภทปัญหา</label>
        <select id="category" name="category" required>
          <option value="">เลือกประเภทปัญหา</option>
          <option>สมาชิกทำผิดกฎ</option>
          <option>การกลั่นแกล้งหรือคุกคาม</option>
          <option>ปัญหาบอทหรือระบบ</option>
          <option>ปัญหาอื่น ๆ</option>
        </select>

        <label for="details">รายละเอียด</label>
        <textarea id="details" name="details"
          minlength="10" maxlength="3000" required
          placeholder="อธิบายปัญหาอย่างน้อย 10 ตัวอักษร"></textarea>

        <label for="evidence">ลิงก์หลักฐาน (ไม่บังคับ)</label>
        <input id="evidence" name="evidence" type="url"
          maxlength="2000" placeholder="https://...">

        <button id="submitButton" type="submit">ส่งรายงาน ♡</button>
        <div id="status" role="status" aria-live="polite"></div>
      </form>
    </section>

    <footer>Lumi Support ♡</footer>
  </main>
</body>
</html>
